---
# =============================================================================
# RKE2 Global Defaults
# =============================================================================
# Every role depends on rke2_common, so these are in scope wherever a role runs,
# at role-defaults precedence. Override per-environment in
# environments/<env>/inventory/group_vars/.

# -----------------------------------------------------------------------------
# RKE2 Core
# -----------------------------------------------------------------------------
rke2_version: ""            # REQUIRED - e.g. "v1.32.2+rke2r1"
rke2_channel: "stable"
rke2_cni: "canal"           # canal, calico, or cilium
rke2_cilium_kube_proxy_replacement: true   # Replace kube-proxy with Cilium eBPF (when cni=cilium)
rke2_cilium_bpf_masquerade: true           # Use BPF masquerading instead of iptables (when cni=cilium)
rke2_master_count: 1        # 1 for single-master, 3 for HA
rke2_cluster_cidr: "10.42.0.0/16"
rke2_service_cidr: "10.43.0.0/16"

# Custom manifests (auto-deployed by RKE2 on server start)
rke2_custom_manifests: []         # List of local paths to YAML manifests to deploy

# -----------------------------------------------------------------------------
# Airgap Installation
# -----------------------------------------------------------------------------
rke2_airgap: false
rke2_airgap_images_path: "/opt/rke2-artifacts"
rke2_registry_mirror: ""
rke2_registry_mirror_tls_skip: false  # Skip TLS verification for registry mirror

# -----------------------------------------------------------------------------
# EKS Distro (optional image override)
# -----------------------------------------------------------------------------
eksd_enabled: false
eksd_registry: "public.ecr.aws/eks-distro"

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
rke2_data_dir: "/var/lib/rancher/rke2"
rke2_config_dir: "/etc/rancher/rke2"

# Runtime bundle shipped inside the data dir: kubectl, crictl, ctr, containerd.
# Populated when the service first starts - the rke2 CLI is NOT here.
rke2_bin_dir: "{{ rke2_data_dir }}/bin"

# get.rke2.io installs by rpm on RHEL-family (/usr/bin) and by tarball
# everywhere else (/usr/local/bin). Override if you force INSTALL_RKE2_METHOD.
rke2_install_bin_dir: "{{ '/usr/bin' if ansible_facts['os_family'] == 'RedHat' else '/usr/local/bin' }}"
rke2_cli: "{{ rke2_install_bin_dir }}/rke2"
rke2_killall_script: "{{ rke2_install_bin_dir }}/rke2-killall.sh"
rke2_uninstall_script: "{{ rke2_install_bin_dir }}/rke2-uninstall.sh"

# Kubernetes node name. RKE2 registers a node under its full hostname, which on
# many cloud images is an FQDN - ansible_hostname truncates it and the lookup
# then misses. Override if you set node-name in the RKE2 config.
rke2_node_name: "{{ ansible_facts['nodename'] | lower }}"
rke2_node_ip: ""            # node-ip, for multi-NIC hosts (empty = RKE2 default)
rke2_node_external_ip: ""   # node-external-ip

# -----------------------------------------------------------------------------
# Load Balancer
# Supported types: kube-vip, external, haproxy
# - kube-vip:  deploys kube-vip DaemonSet on control-plane nodes
# - external:  assumes an external LB is already configured
# - haproxy:   deploys HAProxy + keepalived on dedicated LB nodes
# -----------------------------------------------------------------------------
rke2_lb_type: "external"    # kube-vip, external, or haproxy
rke2_lb_vip: ""             # Virtual IP (required for kube-vip/haproxy)
rke2_lb_external_host: ""   # External LB hostname/IP (required for external)
rke2_vip_interface: ""      # VIP interface; empty = the default-route interface
                            # (eth0 on EC2 Rocky, ens5 on EC2 Ubuntu)
rke2_server_tls_san: []     # Additional TLS SANs for API server cert
rke2_kube_vip_version: "v1.2.3"

# HAProxy + Keepalived defaults are in roles/haproxy/defaults/main.yml
# Override per-environment in group_vars/loadbalancers.yml

# -----------------------------------------------------------------------------
# Lifecycle Management
# -----------------------------------------------------------------------------
rke2_drain_timeout: "300s"
rke2_drain_force: true      # Evict bare pods; a drain without it stalls on any unmanaged pod
rke2_api_ready_timeout: 600 # Seconds to wait for the apiserver after a restart
rke2_service_start_retries: 30

# The install script runs as root, so it must not sit in a world-writable
# directory where an unprivileged user could pre-create it.
rke2_install_script: "/root/.rke2-install.sh"

# Controller-side directory holding the tarballs for rke2_version. Required for
# an airgap UPGRADE; leave empty if you stage them on the nodes yourself.
rke2_airgap_local_artifacts: ""
rke2_upgrade_serial: 1
rke2_upgrade_agent_serial: "25%"
rke2_reboot_after_uninstall: false

# -----------------------------------------------------------------------------
# Production Hardening (empty/false = disabled)
# Enable these for production deployments
# -----------------------------------------------------------------------------

# etcd snapshots
rke2_etcd_snapshot_schedule: ""     # cron format, e.g. "0 */6 * * *"
rke2_etcd_snapshot_retention: 5
rke2_etcd_snapshot_dir: "{{ rke2_data_dir }}/server/db/snapshots"

# Audit logging. RKE2 mounts its own log directory into the apiserver static
# pod; a path outside it needs a kube-apiserver-extra-mount or the records never
# reach the host.
rke2_audit_policy_enabled: false
rke2_audit_log_dir: "{{ rke2_data_dir }}/server/logs"
rke2_audit_log_maxage: 30
rke2_audit_log_maxbackup: 10
rke2_audit_log_maxsize: 100

# Pod Security Admission (restricted, baseline, privileged, or empty)
rke2_pod_security_admission: ""

# Namespaces exempt from PSA enforcement. The control-plane namespaces plus the
# ones RKE2's own charts use - Calico's operator needs privileged pods. Add your
# own rather than editing the template; a namespace listed here is exempt
# forever, so keep the list short.
rke2_pod_security_exemptions:
  - kube-system
  - kube-public
  - kube-node-lease
  - calico-system
  - tigera-operator

# kubelet resource reservations
rke2_kube_reserved_cpu: ""          # e.g. "500m"
rke2_kube_reserved_memory: ""       # e.g. "512Mi"
rke2_system_reserved_cpu: ""        # e.g. "500m"
rke2_system_reserved_memory: ""     # e.g. "512Mi"

# kubelet eviction thresholds (applied independently of reservations)
rke2_eviction_hard: ""              # e.g. "memory.available<256Mi,nodefs.available<10%"

# etcd S3 backup (optional - leave empty to use local snapshots only)
rke2_etcd_s3_enabled: false
rke2_etcd_s3_endpoint: ""              # e.g. "s3.amazonaws.com" or minio endpoint
rke2_etcd_s3_bucket: ""
rke2_etcd_s3_region: ""                # e.g. "us-east-1"
rke2_etcd_s3_access_key: ""
rke2_etcd_s3_secret_key: ""
rke2_etcd_s3_folder: ""                # prefix/folder inside bucket
rke2_etcd_s3_skip_ssl_verify: false

# Benchmark profile validated at startup. RKE2 accepts only "cis" or "etcd";
# anything else, including the older "cis-1.23", is a fatal startup error.
# "cis" also forces protect-kernel-defaults on.
rke2_cis_profile: ""

# Enable SELinux support in containerd. Supported on the RHEL family via the
# rke2-selinux package, and the reason preflight no longer has to go permissive.
rke2_selinux: false

# Kernel hardening
rke2_protect_kernel_defaults: false

# Node scheduling
rke2_server_node_taints: []         # e.g. ["node-role.kubernetes.io/control-plane:NoSchedule"]
rke2_server_node_labels: []         # e.g. ["node-role.kubernetes.io/control-plane=true"]
rke2_agent_node_labels: []          # e.g. ["node-role.kubernetes.io/worker=true"]
rke2_agent_node_taints: []
