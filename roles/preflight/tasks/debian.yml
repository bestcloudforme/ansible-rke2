---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages (Debian)
  ansible.builtin.apt:
    name:
      - tar
      - iptables
      - conntrack
      - socat
      - ipset
      - apt-transport-https
    state: present

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Open RKE2 ports (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] }}"
  loop: "{{ _preflight_ports }}"
  when: ansible_facts.services['ufw.service'].state | default('stopped') == 'running'

- name: Trust the cluster and service CIDRs (ufw)
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
  loop:
    - "{{ rke2_cluster_cidr }}"
    - "{{ rke2_service_cidr }}"
  when: ansible_facts.services['ufw.service'].state | default('stopped') == 'running'
