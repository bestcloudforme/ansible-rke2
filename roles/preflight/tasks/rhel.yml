---
- name: Install required packages (RHEL)
  ansible.builtin.dnf:
    name:
      - tar
      - iptables
      - conntrack-tools
      - socat
      - ipset
    state: present

# RKE2 ships an SELinux policy (rke2-selinux, pulled in by its rpm), so
# enforcing is supported. The default is to leave the host's setting alone
# rather than silently weakening it.
- name: Set SELinux state
  ansible.posix.selinux:
    policy: targeted
    state: "{{ preflight_selinux_state }}"
  when:
    - preflight_selinux_state | length > 0
    - ansible_facts['selinux']['status'] | default('disabled') == 'enabled'

- name: Gather service facts
  ansible.builtin.service_facts:

# NetworkManager claims CNI interfaces as they appear and can tear down the
# overlay. RKE2 documents this exact file.
- name: Keep NetworkManager off the CNI interfaces
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/rke2-canal.conf
    mode: '0644'
    content: |
      [keyfile]
      unmanaged-devices=interface-name:cali*;interface-name:flannel*;interface-name:cilium*;interface-name:lxc*;interface-name:vxlan.calico;interface-name:vxlan-v6.calico
  notify: Reload NetworkManager
  when: ansible_facts.services['NetworkManager.service'] is defined

# nm-cloud-setup rewrites routing from cloud metadata and breaks pod networking
# on RHEL cloud images.
# service_facts does not report .timer units, so the unit files are checked
# directly. Leaving the timer armed lets it re-enable the service on reboot.
- name: Look for the nm-cloud-setup units
  ansible.builtin.stat:
    path: "/usr/lib/systemd/system/{{ item }}"
  loop:
    - nm-cloud-setup.service
    - nm-cloud-setup.timer
  register: nm_cloud_units

- name: Disable nm-cloud-setup
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ nm_cloud_units.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Disable firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: false
    state: stopped
  when:
    - preflight_firewalld_mode == 'disable'
    - ansible_facts.services['firewalld.service'] is defined

- name: Open RKE2 ports (firewalld)
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ _preflight_ports }}"
  when:
    - preflight_firewalld_mode == 'configure'
    - ansible_facts.services['firewalld.service'].state | default('stopped') == 'running'

# Pod and service traffic is not port-scoped; without the CIDRs in the trusted
# zone, cross-node pod traffic is dropped.
- name: Trust the cluster and service CIDRs (firewalld)
  ansible.posix.firewalld:
    source: "{{ item }}"
    zone: trusted
    permanent: true
    state: enabled
    immediate: true
  loop:
    - "{{ rke2_cluster_cidr }}"
    - "{{ rke2_service_cidr }}"
  when:
    - preflight_firewalld_mode == 'configure'
    - ansible_facts.services['firewalld.service'].state | default('stopped') == 'running'
