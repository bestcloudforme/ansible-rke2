---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - rke2_version | default('') | length > 0
      - rke2_cni in ['canal', 'calico', 'cilium', 'none']
      - rke2_lb_type in ['kube-vip', 'external', 'haproxy']
    fail_msg: >-
      Required variables: rke2_version must be set,
      rke2_cni must be canal/calico/cilium/none,
      rke2_lb_type must be kube-vip/external/haproxy

- name: Validate join endpoint is configured
  ansible.builtin.assert:
    that:
      - >-
        (rke2_lb_type in ['kube-vip', 'haproxy'] and rke2_lb_vip | default('') | length > 0)
        or (rke2_lb_type == 'external' and rke2_lb_external_host | default('') | length > 0)
    fail_msg: >-
      Join endpoint not configured. Set rke2_lb_vip (for kube-vip/haproxy)
      or rke2_lb_external_host (for external LB type).
  when: not (rke2_bootstrap | default(false))

- name: Install RKE2 server (online)
  ansible.builtin.include_tasks: install_online.yml
  when: not (rke2_airgap | default(false) | bool)

- name: Install RKE2 server (airgap)
  ansible.builtin.include_tasks: install_airgap.yml
  when: rke2_airgap | default(false) | bool

- name: Configure RKE2 server
  ansible.builtin.include_tasks: config.yml

# The install script is guarded by `creates:`, so it is a no-op once the binary
# exists. Without this, changing rke2_version and re-running install.yml reports
# success while every node stays on the old version - which is what made the
# documented rollback procedure a silent no-op.
- name: Check the installed RKE2 version
  ansible.builtin.command:
    cmd: "{{ rke2_cli }} --version"
  register: rke2_installed_version
  changed_when: false

- name: Installed version must match rke2_version
  ansible.builtin.assert:
    that:
      - rke2_version in rke2_installed_version.stdout
    fail_msg: >-
      {{ inventory_hostname }} is running
      {{ rke2_installed_version.stdout_lines[0] | default('an unknown version') }}
      but rke2_version is {{ rke2_version }}. install.yml does not change the
      version of an existing node - use upgrade.yml.

- name: Start RKE2 server service
  ansible.builtin.include_tasks: service.yml
