---
- name: Set delegate host for multi-master operations
  ansible.builtin.set_fact:
    _other_master: >-
      {{ (groups['masters'] | reject('equalto', inventory_hostname) | list)[0]
         if (groups['masters'] | length > 1)
         else inventory_hostname }}

- name: Record whether the node was already cordoned
  ansible.builtin.command:
    cmd: >
      {{ rke2_bin_dir }}/kubectl
      --kubeconfig {{ rke2_config_dir }}/rke2.yaml
      get node {{ rke2_node_name }} -o jsonpath='{.spec.unschedulable}'
  register: node_was_cordoned
  changed_when: false
  delegate_to: "{{ _other_master }}"

- name: Upgrade master node
  # Cordon and drain sit inside the block so the rescue uncordons after a drain
  # that stalls, rather than leaving the control plane cordoned.
  block:
    - name: Cordon master node before upgrade
      ansible.builtin.command:
        cmd: >
          {{ rke2_bin_dir }}/kubectl
          --kubeconfig {{ rke2_config_dir }}/rke2.yaml
          cordon {{ rke2_node_name }}
      register: cordon_result
      failed_when: cordon_result.rc != 0
      delegate_to: "{{ _other_master }}"
      when: groups['masters'] | length > 1
      changed_when: true

    - name: Drain master node before upgrade
      ansible.builtin.command:
        cmd: >
          {{ rke2_bin_dir }}/kubectl
          --kubeconfig {{ rke2_config_dir }}/rke2.yaml
          drain {{ rke2_node_name }}
          --ignore-daemonsets
          --delete-emptydir-data
          {{ '--force' if rke2_drain_force | bool else '' }}
          --timeout={{ rke2_drain_timeout }}
      register: drain_result
      failed_when: drain_result.rc != 0
      delegate_to: "{{ _other_master }}"
      when: groups['masters'] | length > 1
      changed_when: true

    # Taking a server down costs etcd a member. Refuse if the remaining ones are
    # not all Ready, rather than discovering it after the fact.
    - name: Verify the other control-plane nodes are Ready
      ansible.builtin.command:
        cmd: >
          {{ rke2_bin_dir }}/kubectl
          --kubeconfig {{ rke2_config_dir }}/rke2.yaml
          get nodes -l node-role.kubernetes.io/control-plane
          -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
      register: cp_ready
      changed_when: false
      delegate_to: "{{ _other_master }}"
      when: groups['masters'] | length > 1

    - name: Refuse to proceed with an unhealthy control plane
      ansible.builtin.assert:
        that:
          - cp_ready.stdout_lines | reject('search', '^' ~ rke2_node_name ~ '=') | select('search', '=False$') | list | length == 0
        fail_msg: >-
          Another control-plane node is not Ready. Stopping this one would take
          etcd below quorum. Current state:
          {{ cp_ready.stdout_lines | join(', ') }}
      when: groups['masters'] | length > 1

    - name: Stop rke2-server
      ansible.builtin.systemd:
        name: rke2-server
        state: stopped

    - name: Stage the airgap artifacts
      ansible.builtin.include_tasks: stage_airgap.yml
      when: rke2_airgap | bool

    - name: Download RKE2 install script
      ansible.builtin.get_url:
        url: https://get.rke2.io
        dest: "{{ rke2_install_script }}"
        mode: '0700'
      when: not (rke2_airgap | bool)

    - name: Upgrade RKE2 server
      ansible.builtin.command:
        cmd: "{{ rke2_install_script }}"
      environment: "{{ _rke2_install_env }}"
      changed_when: true

    - name: Start rke2-server
      ansible.builtin.include_tasks: start_rke2.yml
      vars:
        rke2_service_name: rke2-server

    - name: Wait for Kubernetes API to be ready
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        delay: 10
        timeout: "{{ rke2_api_ready_timeout }}"

    - name: Wait for node to be Ready
      ansible.builtin.command:
        cmd: >
          {{ rke2_bin_dir }}/kubectl
          --kubeconfig {{ rke2_config_dir }}/rke2.yaml
          get node {{ rke2_node_name }}
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: node_ready
      until: node_ready.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false
      delegate_to: "{{ _other_master }}"

    - name: Confirm the node is running the target version
      ansible.builtin.command:
        cmd: "{{ rke2_cli }} --version"
      register: upgraded_version
      changed_when: false

    - name: Version must match rke2_version
      ansible.builtin.assert:
        that:
          - rke2_version in upgraded_version.stdout
        fail_msg: >-
          {{ inventory_hostname }} reports {{ upgraded_version.stdout_lines[0] | default('unknown') }}
          after the upgrade, not {{ rke2_version }}.

  rescue:
    - name: Uncordon master node after upgrade failure
      ansible.builtin.command:
        cmd: >
          {{ rke2_bin_dir }}/kubectl
          --kubeconfig {{ rke2_config_dir }}/rke2.yaml
          uncordon {{ rke2_node_name }}
      delegate_to: "{{ _other_master }}"
      when:
        - groups['masters'] | length > 1
        - not (node_was_cordoned.stdout | trim | bool)
      changed_when: true
      failed_when: false

    - name: Fail with upgrade error
      ansible.builtin.fail:
        msg: "Master upgrade failed on {{ inventory_hostname }}. Node has been uncordoned."

- name: Uncordon master node after upgrade
  ansible.builtin.command:
    cmd: >
      {{ rke2_bin_dir }}/kubectl
      --kubeconfig {{ rke2_config_dir }}/rke2.yaml
      uncordon {{ rke2_node_name }}
  delegate_to: "{{ _other_master }}"
  when:
    - groups['masters'] | length > 1
    - not (node_was_cordoned.stdout | trim | bool)
  changed_when: true
