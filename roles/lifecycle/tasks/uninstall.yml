---
- name: Look for the RKE2 uninstall scripts
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ rke2_killall_script }}"
    - "{{ rke2_uninstall_script }}"
  register: uninstall_scripts

- name: Report nodes with nothing to uninstall
  ansible.builtin.debug:
    msg: >-
      No RKE2 uninstall script under {{ rke2_install_bin_dir }} - nothing to do
      on {{ inventory_hostname }}.
  when: not (uninstall_scripts.results | map(attribute='stat.exists') | select | list | length == 2)

- name: Tear RKE2 down
  when: uninstall_scripts.results | map(attribute='stat.exists') | select | list | length == 2
  block:
    - name: Run rke2-killall
      ansible.builtin.command:
        cmd: "{{ rke2_killall_script }}"
      register: killall_result
      changed_when: killall_result.rc == 0

    # A failed uninstall must not be followed by deleting the config directory:
    # that leaves a half-removed node that cannot be reinstalled cleanly.
    - name: Run rke2-uninstall
      ansible.builtin.command:
        cmd: "{{ rke2_uninstall_script }}"
      register: uninstall_result
      changed_when: uninstall_result.rc == 0

    - name: Remove RKE2 config directory
      ansible.builtin.file:
        path: "{{ rke2_config_dir }}"
        state: absent

    - name: Remove the data directory if it is not the default
      ansible.builtin.file:
        path: "{{ rke2_data_dir }}"
        state: absent
      when: rke2_data_dir != '/var/lib/rancher/rke2'

- name: Reboot node after uninstall
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: rke2_reboot_after_uninstall | default(false) | bool
