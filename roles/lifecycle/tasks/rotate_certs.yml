---
- name: Check current certificate expiry
  ansible.builtin.command:
    cmd: >
      openssl x509 -enddate -noout
      -in {{ rke2_data_dir }}/server/tls/serving-kube-apiserver.crt
  register: cert_expiry
  changed_when: false
  failed_when: false

- name: Show current certificate expiry
  ansible.builtin.debug:
    msg: "API server cert: {{ cert_expiry.stdout | default('not found') }}"

# RKE2 documents stop, rotate, start. Rotating under a running server leaves it
# holding the superseded certificates until something restarts it.
- name: Stop rke2-server before rotating
  ansible.builtin.systemd:
    name: rke2-server
    state: stopped

- name: Rotate certificates
  ansible.builtin.command:
    cmd: "{{ rke2_cli }} certificate rotate --data-dir {{ rke2_data_dir }}"
  changed_when: true

- name: Start rke2-server
  ansible.builtin.include_tasks: start_rke2.yml
  vars:
    rke2_service_name: rke2-server

- name: Wait for Kubernetes API to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    delay: 15
    timeout: "{{ rke2_api_ready_timeout }}"

- name: Verify node is Ready
  ansible.builtin.command:
    cmd: >
      {{ rke2_bin_dir }}/kubectl
      --kubeconfig {{ rke2_config_dir }}/rke2.yaml
      get node {{ rke2_node_name }}
      -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false

- name: Verify new certificate expiry
  ansible.builtin.command:
    cmd: >
      openssl x509 -enddate -noout
      -in {{ rke2_data_dir }}/server/tls/serving-kube-apiserver.crt
  register: new_cert_expiry
  changed_when: false

- name: Show new certificate expiry
  ansible.builtin.debug:
    msg: "New API server cert: {{ new_cert_expiry.stdout }}"
