---
- name: Record whether the node was already cordoned
  ansible.builtin.command:
    cmd: >
      {{ rke2_bin_dir }}/kubectl
      --kubeconfig {{ rke2_config_dir }}/rke2.yaml
      get node {{ rke2_node_name }} -o jsonpath='{.spec.unschedulable}'
  register: node_was_cordoned
  changed_when: false
  delegate_to: "{{ groups['masters'][0] }}"

- name: Upgrade worker node
  # Cordon and drain belong inside the block. Outside it, a drain that stalls on
  # a PodDisruptionBudget drops the host from the run with the node left
  # cordoned, and the play moves on to do the same to every remaining worker.
  block:
    - name: Cordon worker node before upgrade
      ansible.builtin.command:
        cmd: >
          {{ rke2_bin_dir }}/kubectl
          --kubeconfig {{ rke2_config_dir }}/rke2.yaml
          cordon {{ rke2_node_name }}
      register: cordon_result
      failed_when: cordon_result.rc != 0
      delegate_to: "{{ groups['masters'][0] }}"
      changed_when: true

    - name: Drain worker node before upgrade
      ansible.builtin.command:
        cmd: >
          {{ rke2_bin_dir }}/kubectl
          --kubeconfig {{ rke2_config_dir }}/rke2.yaml
          drain {{ rke2_node_name }}
          --ignore-daemonsets
          --delete-emptydir-data
          {{ '--force' if rke2_drain_force | bool else '' }}
          --timeout={{ rke2_drain_timeout }}
      register: drain_result
      failed_when: drain_result.rc != 0
      delegate_to: "{{ groups['masters'][0] }}"
      changed_when: true

    - name: Stop rke2-agent
      ansible.builtin.systemd:
        name: rke2-agent
        state: stopped

    - name: Stage the airgap artifacts
      ansible.builtin.include_tasks: stage_airgap.yml
      when: rke2_airgap | bool

    - name: Download RKE2 install script
      ansible.builtin.get_url:
        url: https://get.rke2.io
        dest: "{{ rke2_install_script }}"
        mode: '0700'
      when: not (rke2_airgap | bool)

    - name: Upgrade RKE2 agent
      ansible.builtin.command:
        cmd: "{{ rke2_install_script }}"
      environment: "{{ _rke2_install_env }}"
      changed_when: true

    - name: Start rke2-agent
      ansible.builtin.include_tasks: start_rke2.yml
      vars:
        rke2_service_name: rke2-agent

    - name: Wait for node to be Ready
      ansible.builtin.command:
        cmd: >
          {{ rke2_bin_dir }}/kubectl
          --kubeconfig {{ rke2_config_dir }}/rke2.yaml
          get node {{ rke2_node_name }}
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: node_ready
      until: node_ready.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false
      delegate_to: "{{ groups['masters'][0] }}"

  rescue:
    - name: Uncordon worker node after upgrade failure
      ansible.builtin.command:
        cmd: >
          {{ rke2_bin_dir }}/kubectl
          --kubeconfig {{ rke2_config_dir }}/rke2.yaml
          uncordon {{ rke2_node_name }}
      delegate_to: "{{ groups['masters'][0] }}"
      changed_when: true
      failed_when: false
      when: not (node_was_cordoned.stdout | trim | bool)

    - name: Fail with upgrade error
      ansible.builtin.fail:
        msg: "Worker upgrade failed on {{ inventory_hostname }}. Node has been uncordoned."

# Leave a node alone if the operator had already cordoned it before the run.
- name: Uncordon worker node after upgrade
  ansible.builtin.command:
    cmd: >
      {{ rke2_bin_dir }}/kubectl
      --kubeconfig {{ rke2_config_dir }}/rke2.yaml
      uncordon {{ rke2_node_name }}
  delegate_to: "{{ groups['masters'][0] }}"
  changed_when: true
  when: not (node_was_cordoned.stdout | trim | bool)
