---
- name: "Uninstall RKE2 from workers"
  hosts: workers
  become: true
  roles:
    - role: lifecycle
  vars:
    lifecycle_action: uninstall

- name: "Uninstall RKE2 from masters"
  hosts: masters
  become: true
  roles:
    - role: lifecycle
  vars:
    lifecycle_action: uninstall

- name: "Uninstall HAProxy and Keepalived"
  hosts: loadbalancers
  become: true
  # The haproxy role's defaults carry the port numbers and the check-script path
  # this play removes. Loading it without running it keeps them in scope.
  roles:
    - role: haproxy
      when: false
  tasks:
    - name: Stop keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: stopped
        enabled: false
      ignore_errors: true
      when: rke2_lb_type | default('external') == 'haproxy'

    - name: Stop haproxy
      ansible.builtin.systemd:
        name: haproxy
        state: stopped
        enabled: false
      ignore_errors: true
      when: rke2_lb_type | default('external') == 'haproxy'

    - name: Remove packages (RHEL)
      ansible.builtin.dnf:
        name:
          - haproxy
          - keepalived
        state: absent
      when:
        - rke2_lb_type | default('external') == 'haproxy'
        - ansible_os_family == "RedHat"

    - name: Remove packages (Debian)
      ansible.builtin.apt:
        name:
          - haproxy
          - keepalived
        state: absent
        purge: true
      when:
        - rke2_lb_type | default('external') == 'haproxy'
        - ansible_os_family == "Debian"

    - name: Remove configuration files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/haproxy
        - /etc/keepalived
        - "{{ keepalived_check_script_path }}"
        - /etc/sysctl.d/99-haproxy.conf
        - /etc/systemd/system/haproxy.service.d
      when: rke2_lb_type | default('external') == 'haproxy'

    - name: Drop the SELinux port labels
      community.general.seport:
        ports: "{{ item }}"
        proto: tcp
        setype: http_port_t
        state: absent
      loop:
        - "{{ haproxy_api_frontend_port }}"
        - "{{ haproxy_join_frontend_port }}"
      failed_when: false
      when:
        - rke2_lb_type | default('external') == 'haproxy'
        - ansible_facts['os_family'] == 'RedHat'
        - ansible_facts['selinux']['status'] | default('disabled') == 'enabled'

    - name: Reload systemd after removing the drop-in
      ansible.builtin.systemd:
        daemon_reload: true
      when: rke2_lb_type | default('external') == 'haproxy'
