license:
  - Apache-2.0
license_file: LICENSE
tags:
  - kubernetes
  - rke2
  - rancher
  - k8s
  - cluster
  - ha
  - haproxy
  - keepalived
  - cilium
  - calico
  - canal
  - etcd
  - airgap
repository: https://github.com/bestcloudforme/ansible-rke2
documentation: https://github.com/bestcloudforme/ansible-rke2/blob/main/README.md
homepage: https://github.com/bestcloudforme/ansible-rke2
issues: https://github.com/bestcloudforme/ansible-rke2/issues
dependencies:
  ansible.posix: ">=2.2.0,<3.0.0"
  community.general: ">=13.0.0,<14.0.0"
build_ignore:
  - .github
  - .ansible
  - .ansible-lint
  - .yamllint
  - .gitignore
  - ansible.cfg
  - environments
  - tests
  - kubeconfig.yaml
  - "*.tar.gz"
